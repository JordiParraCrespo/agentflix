# Home media server: Jellyfin + the *arr apps + qBittorrent (behind a VPN)
# + Seerr + Samba.
# Settings come from .env (cp .env.example .env). Run ./setup.sh once first.
#
# Every app sees the same /data folder, so finished downloads are hardlinked
# into the library: no copying, no double disk usage, and seeding continues.
#
#   /data/torrents/{movies,tv}   qBittorrent downloads here
#   /data/media/{movies,tv}      your library (Jellyfin reads this)

x-linuxserver: &linuxserver
  environment: &env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
  restart: unless-stopped
  # Cap container logs so they can never fill the disk.
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Media server: your own Netflix at http://SERVER_IP:8096
  jellyfin:
    <<: *linuxserver
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
      - "7359:7359/udp"   # lets apps on your network find the server
    volumes:
      - ${CONFIG}/jellyfin:/config
      - ${DATA}/media:/data/media

  # Request page for the family: http://SERVER_IP:5055
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    ports:
      - "5055:5055"
    volumes:
      - ${CONFIG}/seerr:/app/config
    restart: unless-stopped
    logging: *logging

  # Films: http://SERVER_IP:7878
  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    volumes:
      - ${CONFIG}/radarr:/config
      - ${DATA}:/data

  # Series: http://SERVER_IP:8989
  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - ${CONFIG}/sonarr:/config
      - ${DATA}:/data

  # Download sources (indexers) for Radarr and Sonarr: http://SERVER_IP:9696
  # Runs inside the VPN like qBittorrent, so searches on indexer sites never
  # leave through the home connection.
  prowlarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${CONFIG}/prowlarr:/config

  # Subtitles: http://SERVER_IP:6767
  bazarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    # Inside the VPN too, so subtitle sites are not visible to the ISP.
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    volumes:
      - ${CONFIG}/bazarr:/config
      - ${DATA}/media:/data/media

  # VPN tunnel (Mullvad by default, see .env). qBittorrent, Prowlarr and
  # Bazarr use this container's network, so they can only reach the internet
  # through the VPN. If the VPN drops, they're offline.
  gluetun:
    image: ghcr.io/qdm12/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-mullvad}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      # Port forwarding lets other peers reach you. Mullvad doesn't have it;
      # set VPN_PORT_FORWARDING=on in .env for a provider that does (Proton).
      PORT_FORWARD_ONLY: ${VPN_PORT_FORWARDING:-off}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      # Tell qBittorrent which port was forwarded (it changes each connection).
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
    ports:
      - "8080:8080" # qBittorrent web UI (lives inside this container's network)
      - "9696:9696" # Prowlarr web UI (same)
      - "6767:6767" # Bazarr web UI (same)
    # Prowlarr and Bazarr have no address of their own any more; keep their
    # names working.
    networks:
      default:
        aliases:
          - prowlarr
          - bazarr
    restart: unless-stopped
    logging: *logging

  # Torrent client: http://SERVER_IP:8080
  # Other apps reach it at host "gluetun", port 8080.
  qbittorrent:
    <<: *linuxserver
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true # re-attach to the VPN whenever gluetun is recreated
    environment:
      <<: *env
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG}/qbittorrent:/config
      - ${DATA}/torrents:/data/torrents

  # Network folders: \\SERVER_IP\media and \\SERVER_IP\torrents
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    environment:
      ACCOUNT_media: ${SAMBA_PASSWORD}
      UID_media: ${PUID}
      AVAHI_DISABLE: "1"
      WSDD2_DISABLE: "1"
      SAMBA_VOLUME_CONFIG_media: "[media]; path = /data/media; valid users = media; guest ok = no; read only = no; browseable = yes"
      SAMBA_VOLUME_CONFIG_torrents: "[torrents]; path = /data/torrents; valid users = media; guest ok = no; read only = no; browseable = yes"
    ports:
      - "445:445"
    volumes:
      - ${DATA}:/data
    restart: unless-stopped
    logging: *logging
