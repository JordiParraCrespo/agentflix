services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host          # simplest way for TVs/phones on the LAN to discover the server
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}   # optional, from https://plex.tv/claim (valid 4 minutes)
    volumes:
      - ./config:/config
      - ${MEDIA_DIR:-./media}/movies:/movies
      - ${MEDIA_DIR:-./media}/tv:/tv
      - ${TRANSCODE_DIR:-./transcode}:/transcode
    # Hardware transcoding (Intel iGPU): uncomment
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
